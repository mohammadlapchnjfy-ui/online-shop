{% extends 'base.html' %}

{% block title %}Add to Cart | DijiKala{% endblock %}

{% block content %}

<h2>🛒 Add to Cart</h2>

<h3>{{ product.name }}</h3>

<p>Price: ${{ product.price }}</p>
<p>Available Stock: {{ product.stock }}</p>

<form method="post">
    {% csrf_token %}

    {{ form.as_p }}

    <button type="submit" class="btn">
        Add to Cart
    </button>
</form>

{% endblock %}
